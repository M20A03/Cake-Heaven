<div class="toast-container" aria-live="polite" aria-atomic="true">
  @for (toast of notificationService.toasts(); track toast.id) {
    <div class="toast-card toast-{{ toast.type }}" role="alert">
      <div class="toast-icon">
        @switch (toast.type) {
          @case ('success') {
            <svg class="toast-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
          }
          @case ('error') {
            <svg class="toast-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          }
          @case ('warning') {
            <svg class="toast-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          }
          @case ('info') {
            <svg class="toast-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="16" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12.01" y2="8"></line>
            </svg>
          }
        }
      </div>
      <div class="toast-content">
        <h4 class="toast-title">{{ toast.title }}</h4>
        @if (toast.message) {
          <p class="toast-message">{{ toast.message }}</p>
        }
      </div>
      <button type="button" class="toast-close" (click)="dismiss(toast.id)" aria-label="Close notification">
        ✕
      </button>
    </div>
  }
</div>
